[package]
name = "pacpad"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "A terminal app manager for Arch: browse, search and manage packages, web apps and TUI launchers"
license = "Apache-2.0"
repository = "https://github.com/ric-v/pacpad"
keywords = ["pacman", "arch", "tui", "package-manager", "aur"]
categories = ["command-line-utilities"]
include = ["src/**/*", "README.md", "LICENSE", "Cargo.toml"]

[dependencies]
anyhow = "1"
bincode = { version = "2", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
flate2 = "1"
nucleo-matcher = "0.3"
portable-pty = "0.9.0"
ratatui = "0.30"
ruzstd = "0.8.2"
serde = { version = "1", features = ["derive"] }
tar = "0.4"
toml = "1.0.7"
ureq = { version = "3.2.1", default-features = false, features = ["rustls"] }
vt100 = "0.16.2"

[profile.release]
lto = "thin"
strip = true

[dev-dependencies]
libc = "0.2.189"
